name: Universal Chatbot Automation Framework

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      app_url:
        description: "Target EFI Chatbot App URL"
        required: true
        default: "https://dtqponlzcij0l.cloudfront.net/"

      framework_excel_url:
        description: "EFI Question Bank Excel URL (GitHub Raw)"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks(EFI).xlsx"

      credentials_excel_url:
        description: "EFI Credentials Excel URL (GitHub Raw)"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/credentials(2).xlsx"

      result_excel_url:
        description: "EFI Result Excel URL (GitHub Raw)"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks-Result(EFI).xlsx"

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          python --version
          google-chrome --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Maven Tests
        run: |
          mvn clean test -e -Dsurefire.useFile=false \
            -Dapp.url="${{ inputs.app_url || 'https://dtqponlzcij0l.cloudfront.net/' }}" \
            -Dframework.excel.url="${{ inputs.framework_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks(EFI).xlsx' }}" \
            -Dcredentials.excel.url="${{ inputs.credentials_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/credentials(2).xlsx' }}" \
            -Dresult.excel.url="${{ inputs.result_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks-Result(EFI).xlsx' }}"

      - name: Run Python AI Evaluator
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python engine_ai_evaluator.py \
            --input Frameworks_Output.xlsx \
            --output Frameworks-Result.xlsx

      - name: Generate JSON Summary for Dashboard
        if: always()
        run: |
          python -c "
          import pandas as pd
          import json
          from datetime import datetime

          try:
              df = pd.read_excel('Frameworks-Result.xlsx')
              total = len(df)
              status_col = 'Status' if 'Status' in df.columns else (df.columns[-1] if len(df.columns) > 0 else 'Status')
              passed = int(df[df[status_col].astype(str).str.upper() == 'PASS'].shape[0])
              failed = total - passed
              pass_rate = round((passed / total) * 100, 2) if total > 0 else 0
          except Exception as e:
              print(f'Error reading Excel: {e}')
              total, passed, failed, pass_rate = 0, 0, 0, 0

          data = {
              'totalTests': total,
              'passedTests': passed,
              'failedTests': failed,
              'passRate': pass_rate,
              'lastUpdated': datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')
          }

          with open('results.json', 'w') as f:
              json.dump(data, f, indent=4)
          print('Successfully generated results.json')
          "

      - name: Upload Test Reports & Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chatbot-test-reports
          path: |
            target/surefire-reports/
            Frameworks_Output.xlsx
            Frameworks-Result.xlsx
            results.json
          if-no-files-found: warn
