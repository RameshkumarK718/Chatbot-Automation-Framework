name: EFI Chatbot QA Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Install Google Chrome & Stable Driver
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3
        
        # Install Google Chrome Stable
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -fy install
        rm google-chrome-stable_current_amd64.deb
        
        google-chrome --version
        chromedriver --version || echo "ChromeDriver managed automatically by WebDriverManager"

    - name: Verify Environment Configuration
      run: |
        echo "Java Version:"
        java -version
        echo "Maven Version:"
        mvn -version

    - name: Execute TestNG Suite with Maven
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        mvn clean test -Dtest=ChatbotTest -Dheadless=true
      continue-on-error: true

    - name: Commit and Push Updated EFI Execution Report
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git status
        
        BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
        echo "Target branch for commit: $BRANCH_NAME"

        git stash || true
        git add EFI.xlsx || true
        
        # Check if there are actual changes to commit
        if git diff --staged --quiet; then
          echo "No changes detected in EFI.xlsx to commit."
        else
          git commit -m "chore: update automated EFI execution report [skip ci]"
          git pull origin "$BRANCH_NAME" --rebase --autostash || echo "Rebase warning bypassed"
          git push origin "$BRANCH_NAME"
          echo "Successfully pushed updated report to $BRANCH_NAME"
        fi

    - name: Upload Comprehensive Execution Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: EFI_Execution_Report_Bundle
        if-no-files-found: warn
        path: |
          EFI.xlsx
          target/surefire-reports/
          target/screenshots/
        retention-days: 30
