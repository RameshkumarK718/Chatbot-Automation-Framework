name: Universal Chatbot Automation Framework
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Target EFI chatbot app URL"
        required: true
        default: "https://dtqponlzcij0l.cloudfront.net/"
      framework_excel_url:
        description: "EFI question bank Excel URL"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks(EFI).xlsx"
      credentials_excel_url:
        description: "Credentials Excel URL"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/credentials(2).xlsx"
      result_excel_url:
        description: "Result template Excel URL"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks-Result(EFI).xlsx"

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          python --version
          google-chrome --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run Maven Tests
        env:
          APP_URL: ${{ inputs.app_url || 'https://dtqponlzcij0l.cloudfront.net/' }}
          FRAMEWORK_EXCEL_URL: ${{ inputs.framework_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks(EFI).xlsx' }}
          CREDENTIALS_EXCEL_URL: ${{ inputs.credentials_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/credentials(2).xlsx' }}
          RESULT_EXCEL_URL: ${{ inputs.result_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks-Result(EFI).xlsx' }}
        run: |
          mvn clean test -e -Dsurefire.useFile=false \
            "-Dapp.url=${APP_URL}" \
            "-Dframework.excel.url=${FRAMEWORK_EXCEL_URL}" \
            "-Dcredentials.excel.url=${CREDENTIALS_EXCEL_URL}" \
            "-Dresult.excel.url=${RESULT_EXCEL_URL}"

      - name: Run Python AI Evaluator
        if: success() && github.event_name != 'pull_request'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ] && [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::Configure OPENAI_API_KEY or OPENROUTER_API_KEY in repository secrets."
            exit 1
          fi

          if [ ! -f "Frameworks-Result(EFI)_Output.xlsx" ]; then
            echo "::error::Java-generated Frameworks-Result(EFI)_Output.xlsx was not found."
            exit 1
          fi

          python engine_ai_evaluator.py \
            --input "Frameworks-Result(EFI)_Output.xlsx" \
            --output "Frameworks-Result.xlsx"

      - name: Upload Test Reports & Results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chatbot-test-reports
          path: |
            target/surefire-reports/
            target/diagnostics/
            target/test_results.json
            Frameworks-Result(EFI)_Output.xlsx
            Frameworks-Result.xlsx
            index.html
          if-no-files-found: warn
