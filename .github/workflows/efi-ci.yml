name: Universal Chatbot Automation Framework
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      app_url:
        description: "Target EFI Chatbot App URL"
        required: true
        default: "https://dtqponlzcij0l.cloudfront.net/"

      framework_excel_url:
        description: "EFI Question Bank Excel URL (GitHub Raw)"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks(EFI).xlsx"

      credentials_excel_url:
        description: "EFI Credentials Excel URL (GitHub Raw)"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/credentials(2).xlsx"

      result_excel_url:
        description: "EFI Result Excel URL (GitHub Raw)"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks-Result(EFI).xlsx"

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          python --version
          google-chrome --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run Maven Tests
        run: |
          mvn clean test -e -Dsurefire.useFile=false \
            -Dapp.url="${{ inputs.app_url || 'https://dtqponlzcij0l.cloudfront.net/' }}" \
            -Dframework.excel.url="${{ inputs.framework_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks(EFI).xlsx' }}" \
            -Dcredentials.excel.url="${{ inputs.credentials_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/credentials(2).xlsx' }}" \
            -Dresult.excel.url="${{ inputs.result_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks-Result(EFI).xlsx' }}"

      - name: Run Python AI Evaluator
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          INPUT_FILE=""
          if [ -f "Frameworks-Result(EFI).xlsx" ]; then
            INPUT_FILE="Frameworks-Result(EFI).xlsx"
          elif [ -f "Frameworks(EFI).xlsx" ]; then
            INPUT_FILE="Frameworks(EFI).xlsx"
          else
            echo "::error::Neither Frameworks-Result(EFI).xlsx nor Frameworks(EFI).xlsx was found."
            exit 1
          fi

          echo "Running AI Evaluator on input: $INPUT_FILE"
          python engine_ai_evaluator.py \
            --input "$INPUT_FILE" \
            --output "Frameworks-Result(EFI).xlsx"

      - name: Upload Test Reports & Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-test-reports
          path: |
            target/surefire-reports/
            Frameworks-Result(EFI).xlsx
            index.html
          if-no-files-found: warn
