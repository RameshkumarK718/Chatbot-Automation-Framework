name: Universal Chatbot Automation Framework
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      app_url:
        description: "Target Vedas Chatbot App URL"
        required: true
        default: "https://devdedham.aptussoft.com/MemberAPI"

      framework_excel_url:
        description: "Vedas Question Bank Excel URL (GitHub Raw)"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks(Vedas).xlsx"

      credentials_excel_url:
        description: "Vedas Credentials Excel URL (GitHub Raw)"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/credentials(1).xlsx"

      result_excel_url:
        description: "Vedas Result Excel URL (GitHub Raw)"
        required: true
        default: "https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks-Result(Vedas).xlsx"

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          python --version
          google-chrome --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run Maven Tests
        run: |
          mvn clean test -e -Dsurefire.useFile=false \
            -Dapp.url="${{ inputs.app_url || 'https://devdedham.aptussoft.com/MemberAPI' }}" \
            -Dframework.excel.url="${{ inputs.framework_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks(Vedas).xlsx' }}" \
            -Dcredentials.excel.url="${{ inputs.credentials_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/credentials(2).xlsx' }}" \
            -Dresult.excel.url="${{ inputs.result_excel_url || 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks-Result(Vedas).xlsx' }}"

      - name: Run Python AI Evaluator
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -f "Frameworks-Result(Vedas).xlsx" ]; then
            python engine_ai_evaluator.py \
              --input "Frameworks-Result(Vedas).xlsx" \
              --output "Frameworks-Result.xlsx"
          else
            echo "::error::Frameworks-Result(Vedas).xlsx was not found."
            exit 1
          fi

      - name: Upload Test Reports & Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-test-reports
          path: |
            target/surefire-reports/
            Frameworks-Result(Vedas).xlsx
            Frameworks-Result.xlsx
            index.html
          if-no-files-found: warn
