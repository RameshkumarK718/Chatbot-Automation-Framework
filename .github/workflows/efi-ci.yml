name: EFI QA Automation CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Set up Google Chrome
      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      # 4. Verify environment
      - name: Verify Environment
        run: |
          echo "Java Version:"
          java -version

          echo "Maven Version:"
          mvn -version

          echo "Google Chrome Version:"
          google-chrome --version

      # 5. Run Chatbot Automation Tests
      - name: Execute Chatbot Automation Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mvn clean test -Dtest=ChatbotTest -Dheadless=true
        continue-on-error: true

      # 6. Commit updated EFI Excel report
      - name: Commit and Push Updated EFI Report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git status

          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Target branch: $BRANCH_NAME"

          git add EFI.xlsx

          if git diff --staged --quiet; then
            echo "No changes detected in EFI.xlsx."
          else
            git commit -m "chore: update automated EFI execution report [skip ci]"

            git pull origin "$BRANCH_NAME" --rebase --autostash

            git push origin "$BRANCH_NAME"

            echo "Successfully pushed updated EFI.xlsx."
          fi

      # 7. Upload test reports and screenshots
      - name: Upload EFI Execution Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: EFI_Execution_Report_Bundle
          if-no-files-found: warn
          path: |
            EFI.xlsx
            target/surefire-reports/
            target/screenshots/
