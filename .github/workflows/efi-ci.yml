name: Universal Chatbot Automation Framework

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Target Chatbot App URL'
        required: true
        default: 'https://dtqponlzcij0l.cloudfront.net/'
      framework_excel_url:
        description: 'Question Bank Excel URL (GitHub Raw)'
        required: true
        default: 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks(EFI).xlsx'
      credentials_excel_url:
        description: 'Credentials Excel URL (GitHub Raw)'
        required: true
        default: 'https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/credentials(2).xlsx'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Maven Tests with Live Error Streaming
        run: |
          mvn clean test -e -Dsurefire.useFile=false \
            -Dapp.url="${{ github.event.inputs.app_url }}" \
            -Dframework.excel.url="${{ github.event.inputs.framework_excel_url }}" \
            -Dcredentials.excel.url="${{ github.event.inputs.credentials_excel_url }}"

      - name: Run Python AI Evaluator
        if: always() # Runs even if tests fail, or you can remove this if you only want it to run on success
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python engine_ai_evaluator.py --input Frameworks_Output.xlsx --output Frameworks-Result.xlsx

      - name: Upload Test Reports & Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-test-reports
          path: |
            target/surefire-reports/
            Frameworks_Output.xlsx
            Frameworks-Result.xlsx
