name: EFI Automation Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-automation-and-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Run Selenium Automation Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: mvn clean test -Dtest=ChatbotTest
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas openpyxl openai requests
          fi

      - name: Check Environment Files
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Python files:"
          ls -la *.py || true
          echo "Excel files:"
          ls -la *.xlsx || true

      - name: Grant execution permission (if Python evaluator exists)
        run: |
          if [ -f engine_ai_evaluator.py ]; then
            chmod +x engine_ai_evaluator.py
            python engine_ai_evaluator.py
          else
            echo "engine_ai_evaluator.py not found, skipping standalone AI evaluator script."
          fi

      - name: Commit and Push Dynamically Generated Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          
          # Get current branch name dynamically to prevent branch push mismatches
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Current branch: $BRANCH_NAME"

          git stash || true
          # Add the generated execution report from the Java test run
          git add EFI_Execution_Report.xlsx || true
          git commit -m "chore: update dynamically generated EFI execution report [skip ci]" \
            || echo "No changes to commit"
          
          git pull origin $BRANCH_NAME --rebase || echo "Rebase skipped or not needed"
          git push origin $BRANCH_NAME

      - name: Upload Test Results and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-reports
          if-no-files-found: ignore
          path: |
            EFI_Execution_Report.xlsx
            target/surefire-reports/
