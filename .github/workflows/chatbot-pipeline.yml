name: Chatbot Automation Pipeline
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
      # 2. Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      # 3. Set up Chrome Browser
      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v2
      # 4. Verify Java, Maven and Chrome
      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version
      # 5. Run Java Selenium Automation Tests
      - name: Run Java Maven Automation Tests
        run: |
          mvn clean test -Dtest=ChatbotTest
      # 6. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      # 7. Verify Python
      - name: Verify Python
        run: |
          python --version
          pip --version
      # 8. Install Python Dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # 9. Run AI Evaluation
      - name: Run AI Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python AIEvaluator.py
      # 10. Upload Automation Results and Reports
      - name: Upload Test Results and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-reports
          path: |
            FrameworkQA.csv
            *.xlsx
            target/surefire-reports/
          retention-days: 30
