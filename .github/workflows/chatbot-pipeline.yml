name: Chatbot End-to-End Automation & AI Audit
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  run-automation-and-eval:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl openai requests
    - name: Run Selenium Tests via Maven
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        mvn test -Dtest=ChatbotTest
    - name: Run AI Evaluator Script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python engine_ai_evaluator.py
    - name: Upload Final Audit Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Frameworks_Results
        path: Frameworks_Results.xlsx
