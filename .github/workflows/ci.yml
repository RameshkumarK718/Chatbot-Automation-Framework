name: Chatbot Automation Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-automation-and-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v2
      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version
      - name: Run Selenium Automation Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: mvn clean test -Dtest=ChatbotTest
        continue-on-error: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas openpyxl openai requests
          fi
      - name: Check AI Evaluator Files
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Python files:"
          ls -la *.py || true
          echo "Excel files:"
          ls -la *.xlsx || true
      - name: Grant execution permission
        run: chmod +x engine_ai_evaluator.py
      - name: Run AI Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python engine_ai_evaluator.py
      - name: Commit and Push Dynamically Generated Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          # Stash any unexpected or leftover unstaged changes (like Frameworks.xlsx)
          git stash || true
          git add Frameworks-Result.xlsx
          git commit -m "chore: update dynamically generated AI evaluation report [skip ci]" \
            || echo "No changes to commit"
          git pull origin main --rebase
          git push origin main
      - name: Upload Test Results and Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: automation-reports
          if-no-files-found: ignore
          path: |
            Frameworks-Result.xlsx
            target/surefire-reports/
