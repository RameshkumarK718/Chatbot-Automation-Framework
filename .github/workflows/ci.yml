name: Chatbot Automation Pipeline
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  run-automation-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1
      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version
      - name: Run Selenium Automation Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: mvn clean test -Dtest=ChatbotTest
        continue-on-error: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas openpyxl openai requests; fi
      - name: Run AI Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python engine_ai_evaluator.py
      - name: Upload Test Results and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-reports
          path: |
            Frameworks_Results.xlsx
            target/surefire-reports/
