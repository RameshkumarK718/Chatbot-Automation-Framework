# CHATBOT ENVIRONMENT CONFIGURATION
app.url=https://dtqponlzcij0l.cloudfront.net/
credentials.excel.url=https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/credentials(2).xlsx
framework.excel.url=https://raw.githubusercontent.com/RameshkumarK718/Chatbot-Automation-Framework/main/Frameworks(EFI).xlsx

# DYNAMIC UI LOCATORS (Configurable per Chatbot)
# Set to true if the chatbot requires login, false if it opens directly to chat
login.required=true

# Initial Gate / Role Selection (Leave blank if none)
locator.type.role=xpath
locator.value.role=//button[contains(normalize-space(), 'End User')]

# Login Inputs & Buttons
locator.type.email=id
locator.value.email=vaa-email

locator.type.password=id
locator.value.password=vaa-pw

locator.type.submit=id
locator.value.submit=vaa-submit

# Post-Login Navigation / Portal Button (Leave blank if none)
locator.type.portal=xpath
locator.value.portal=//*[contains(normalize-space(), 'Conversational AI')]

# Chat Interface Locators
locator.type.chat.input=xpath
locator.value.chat.input=//input[@placeholder='Ask a question...'] | //textarea[@placeholder='Ask a question...'] | //div[@contenteditable='true']

locator.type.chat.messages=xpath
locator.value.chat.messages=//div[contains(@class,'message')] | //div[contains(@class,'bot-response')] | //div[contains(@class,'chat-bubble')]
