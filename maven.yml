name: Chatbot Automation CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Enables manual run button in GitHub Actions tab
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up Chrome Browser
      uses: browser-actions/setup-chrome@v1
    - name: Run Maven Tests
      run: mvn clean test -Dtest=ChatbotTest
