<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Dual-Viewport Chatbot Playground v5.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f1f5f9; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
        .cursor-blink::after {
            content: '█';
            animation: cursorBlink 0.8s infinite;
            color: #6366f1;
            margin-left: 2px;
        }
        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-100">
<header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shrink-0 px-6 py-3 flex items-center justify-between z-30">
    <div class="flex items-center space-x-3">
        <button onclick="toggleSidebar('left-sidebar', true)" class="lg:hidden p-2 -ml-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
            <i class="fa-solid fa-bars-staggered text-lg"></i>
        </button>
        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
            <i class="fa-solid fa-microchip text-sm"></i>
        </div>
        <div>
            <div class="flex items-center space-x-2">
                <h1 class="text-sm font-bold bg-gradient-to-r from-white via-indigo-200 to-indigo-400 bg-clip-text text-transparent">Gemini AI Suite</h1>
                <span class="text-[9px] font-mono bg-indigo-950 text-indigo-400 border border-indigo-800/60 px-1.5 py-0.2 rounded-full">v5.0</span>
            </div>
            <p class="text-[10px] text-slate-400 hidden sm:block">Enterprise Multi-Channel Control Console</p>
        </div>
    </div>
    <div class="flex items-center space-x-4">
        <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1">
            <span class="text-[9px] text-slate-500 font-mono mr-2">ACTIVE MODEL:</span>
            <select id="model-selector" class="bg-transparent text-xs font-semibold text-indigo-300 focus:outline-none cursor-pointer">
                <option value="gemini-1.5-pro" class="bg-slate-900 text-slate-200">Gemini 1.5 Pro</option>
                <option value="gemini-1.5-flash" class="bg-slate-900 text-slate-200">Gemini 1.5 Flash</option>
            </select>
        </div>
        <div class="hidden md:flex items-center bg-slate-950 px-2.5 py-1 rounded-md border border-slate-800/80 text-[10px] font-mono">
            <span class="flex h-2 w-2 relative mr-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span class="text-slate-400">ENGINE STATE:</span>
            <span class="text-indigo-400 ml-1 font-bold">ONLINE_V5</span>
        </div>
        <button onclick="toggleSidebar('right-sidebar', true)" class="lg:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
            <i class="fa-solid fa-sliders text-lg"></i>
        </button>
    </div>
</header>
<div class="flex-1 flex overflow-hidden relative">
    <div id="left-sidebar-backdrop" onclick="toggleSidebar('left-sidebar', false)" class="hidden fixed inset-0 bg-black/70 z-30 lg:hidden"></div>
    <aside id="left-sidebar" class="fixed inset-y-0 left-0 w-[280px] bg-slate-900 border-r border-slate-800 flex flex-col h-full transform -translate-x-full lg:transform-none lg:static transition-transform duration-300 ease-in-out z-40 shrink-0">
        <div class="p-4 space-y-2 shrink-0">
            <button onclick="createNewThread()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/10 hover:shadow-indigo-600/20 transition-all group">
                <i class="fa-solid fa-plus group-hover:rotate-90 transition-transform"></i>
                <span>Start New Thread</span>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto px-2 space-y-1">
            <div id="channels-list" class="space-y-1"></div>
        </div>
    </aside>
    <main class="flex-1 flex flex-col h-full bg-slate-950 overflow-hidden min-w-0">
        <div class="bg-slate-900/40 border-b border-slate-800 p-3 flex justify-between items-center px-4 md:px-6 shrink-0">
            <div>
                <span id="active-channel-title" class="text-xs font-bold uppercase tracking-wider text-indigo-400"><i class="fa-solid fa-hashtag mr-1"></i>General Core Support</span>
                <p id="active-channel-desc" class="text-[10px] text-slate-500 hidden sm:block">Direct natural language parsing channel pipeline</p>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="clearChatLog()" class="text-[10px] font-semibold bg-slate-900/60 hover:bg-red-950/40 text-slate-400 hover:text-red-400 px-3 py-1.5 rounded-lg border border-slate-800 transition-colors">
                    <i class="fa-solid fa-trash-can mr-1.5"></i>Clear History
                </button>
            </div>
        </div>
        <div id="chat-scroller" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4"></div>
        <div class="p-4 bg-slate-900 border-t border-slate-800 space-y-3 shrink-0">
            <div class="max-w-4xl mx-auto flex items-end space-x-2 bg-slate-950 border border-slate-800 focus-within:border-indigo-500/50 rounded-xl p-2 transition-all">
                <textarea id="chat-input" rows="1" placeholder="Describe your prompt here (Shift + Enter for new lines)..." class="flex-1 bg-transparent border-0 focus:outline-none focus:ring-0 text-xs text-slate-100 placeholder-slate-500 max-h-32 resize-none py-2 px-3 align-bottom" onkeydown="handleInputKeyPress(event)"></textarea>
                <button id="send-button" onclick="submitUserMessage()" class="w-8 h-8 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition-all flex items-center justify-center shrink-0 shadow-lg shadow-indigo-600/10">
                    <i id="send-icon" class="fa-solid fa-arrow-up text-sm"></i>
                </button>
            </div>
        </div>
    </main>
    <aside id="right-sidebar" class="fixed inset-y-0 right-0 w-[320px] bg-slate-900 border-l border-slate-800 flex flex-col h-full transform translate-x-full lg:transform-none lg:static transition-transform duration-300 ease-in-out z-40 shrink-0">
        <div class="p-5 flex-1 overflow-y-auto space-y-6">
            <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2"><i class="fa-solid fa-microchip mr-1.5"></i>Live Engine Analytics</h3>
            <div class="grid grid-cols-1 gap-2 font-mono text-[11px]">
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-850 flex justify-between items-center">
                    <span class="text-slate-500">intent:</span>
                    <span id="register-intent" class="text-indigo-400 font-bold">session_init</span>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-850 flex justify-between items-center">
                    <span class="text-slate-500">engine_speed:</span>
                    <span id="register-latency" class="text-cyan-400 font-bold">0ms</span>
                </div>
            </div>
        </div>
    </aside>
</div>

<script>
    // Set your valid Gemini API Key here
    const API_KEY = "YOUR_GEMINI_API_KEY";

    const channels = {
        'general-core': {
            id: 'general-core',
            name: 'General Core Support',
            desc: 'Direct natural language parsing channel pipeline',
            icon: 'fa-regular fa-comments',
            messages: [{
                id: 1,
                role: 'assistant',
                sender: 'GeminiAgent',
                badge: 'SYS_BOT',
                time: 'Delivered just now',
                content: 'Hello! I am Gemini AI v5.0. Ask me any question to test execution.'
            }]
        }
    };
    
    let activeChannelId = 'general-core';
    let isStreaming = false;
    const engineConfig = { temp: 0.7, tokens: 2048, topp: 0.9, model: 'gemini-1.5-flash' };

    const chatScroller = document.getElementById('chat-scroller');
    const chatInput = document.getElementById('chat-input');
    const registerLatency = document.getElementById('register-latency');
    const registerIntent = document.getElementById('register-intent');

    window.addEventListener('DOMContentLoaded', () => {
        renderChannelsList();
        loadActiveChannel();
        setupInputAutoResize();
    });

    function setupInputAutoResize() {
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    }

    function handleInputKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            submitUserMessage();
        }
    }

    function toggleSidebar(id, show) {
        const sidebar = document.getElementById(id);
        const backdrop = document.getElementById(`${id}-backdrop`);
        if (!sidebar) return;
        if (show) {
            sidebar.classList.remove('-translate-x-full', 'translate-x-full');
            if (backdrop) backdrop.classList.remove('hidden');
        } else {
            if (id === 'left-sidebar') sidebar.classList.add('-translate-x-full');
            if (id === 'right-sidebar') sidebar.classList.add('translate-x-full');
            if (backdrop) backdrop.classList.add('hidden');
        }
    }

    function renderChannelsList() {
        const listContainer = document.getElementById('channels-list');
        listContainer.innerHTML = '';
        Object.values(channels).forEach(ch => {
            const isActive = ch.id === activeChannelId;
            const btn = document.createElement('button');
            btn.className = `w-full text-left px-3 py-2.5 text-xs rounded-lg flex items-center justify-between transition-all ${isActive ? 'bg-indigo-600/10 border border-indigo-500/30 text-indigo-200 font-semibold' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40 border border-transparent'}`;
            btn.onclick = () => switchChannel(ch.id);
            btn.innerHTML = `<span class="truncate flex items-center"><i class="${ch.icon} mr-2 text-xs"></i>${ch.name}</span>`;
            listContainer.appendChild(btn);
        });
    }

    function loadActiveChannel() {
        const ch = channels[activeChannelId];
        document.getElementById('active-channel-title').innerHTML = `<i class="${ch.icon} mr-1.5"></i>${ch.name}`;
        document.getElementById('active-channel-desc').innerText = ch.desc;
        chatScroller.innerHTML = '';
        ch.messages.forEach(msg => renderMessageBubble(msg));
        chatScroller.scrollTo({ top: chatScroller.scrollHeight });
    }

    function renderMessageBubble(msg) {
        const isUser = msg.role === 'user';
        const bubbleWrapper = document.createElement('div');
        bubbleWrapper.className = `flex items-start space-x-3 max-w-[85%] md:max-w-[75%] my-2 ${isUser ? 'ml-auto justify-end' : ''}`;
        
        let headerRow = `<div class="flex items-center space-x-2 ${isUser ? 'justify-end' : ''}">
            <span class="text-xs font-bold text-slate-200">${msg.sender}</span>
            <span class="text-[9px] bg-indigo-950/80 text-indigo-400 px-1.5 py-0.5 rounded border border-indigo-900 font-mono">${msg.badge}</span>
        </div>`;

        bubbleWrapper.innerHTML = `
            <div class="space-y-1 ${isUser ? 'text-right' : 'text-left'}">
                ${headerRow}
                <div class="${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-900 border border-slate-800/80 text-slate-300'} rounded-2xl p-4 text-xs leading-relaxed shadow-sm">
                    <div>${parseMarkdown(msg.content)}</div>
                </div>
                <span class="text-[9px] text-slate-600 font-mono block pl-1">${msg.time}</span>
            </div>
        `;
        chatScroller.appendChild(bubbleWrapper);
    }

    function parseMarkdown(text) {
        return text
            .replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/\*\*([^*]+)\*\*/g, '<strong class="font-bold text-white">$1</strong>')
            .replace(/`([^`]+)`/g, '<code class="bg-slate-950 text-rose-400 font-mono px-1 rounded">$1</code>');
    }

    function switchChannel(channelId) {
        if (isStreaming) return;
        activeChannelId = channelId;
        renderChannelsList();
        loadActiveChannel();
    }

    function submitUserMessage() {
        if (isStreaming) return;
        const userPrompt = chatInput.value.trim();
        if (!userPrompt) return;
        
        chatInput.value = '';
        chatInput.style.height = 'auto';

        appendMessageDirectly('user', 'You', 'OPERATOR', userPrompt);
        executeResponsePipeline(userPrompt);
    }

    function appendMessageDirectly(role, sender, badge, text) {
        const msg = { id: Date.now(), role, sender, badge, time: 'Delivered just now', content: text };
        channels[activeChannelId].messages.push(msg);
        renderMessageBubble(msg);
        chatScroller.scrollTo({ top: chatScroller.scrollHeight, behavior: 'smooth' });
    }

    async function executeResponsePipeline(userPrompt) {
        isStreaming = true;
        registerIntent.innerText = 'generate_content';
        const startTime = Date.now();

        try {
            const apiResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${engineConfig.model}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: userPrompt }] }] })
            });
            
            const data = await apiResponse.json();
            const latency = Date.now() - startTime;
            registerLatency.innerText = `${latency}ms`;

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const text = data.candidates[0].content.parts[0].text;
                appendMessageDirectly('assistant', 'GeminiAgent', 'API_BOT', text);
            } else {
                appendMessageDirectly('assistant', 'GeminiAgent', 'ERROR', 'Error processing request or invalid API key.');
            }
        } catch (err) {
            appendMessageDirectly('assistant', 'GeminiAgent', 'ERROR', 'Failed to connect to backend service.');
        } finally {
            isStreaming = false;
        }
    }

    function clearChatLog() {
        if (isStreaming) return;
        channels[activeChannelId].messages = [];
        loadActiveChannel();
    }
    function createNewThread() {
        const threadName = prompt("Enter thread name:", "Custom Workspace");
        if (!threadName) return;
        const safeId = 'ch-' + Date.now();
        channels[safeId] = { id: safeId, name: threadName, desc: 'Workspace thread', icon: 'fa-solid fa-cubes-stacked', messages: [] };
        switchChannel(safeId);
    }
</script>
</body>
</html>
